version: '3.8'

services:
  scholarsmate:
    build:
      context: .
      dockerfile: Dockerfile
    image: scholarsmate:latest
    container_name: scholarsmate_app
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - AWS_REGION_NAME=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - DAILY_TOKEN_LIMIT=100000
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  caddy:
    image: caddy:2-alpine
    container_name: scholarsmate_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scholarsmate

volumes:
  caddy_data:
  caddy_config:

