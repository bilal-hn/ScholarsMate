version: '3.8'

services:
  scholarsmate:
    build:
      context: .
      dockerfile: Dockerfile
    image: scholarsmate:latest
    container_name: scholarsmate_app
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
