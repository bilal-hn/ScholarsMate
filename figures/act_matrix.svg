<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" width="760" height="840" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .start-node { fill: #0f172a; stroke: none; }
    .end-node-outer { fill: none; stroke: #0f172a; stroke-width: 2; }
    .end-node-inner { fill: #0f172a; stroke: none; }
    .act-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .act-box-accent { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 8; }
    .dec-node { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.5; }
    .fork-bar { fill: #1e293b; stroke: none; rx: 2; }
    .flow-line { fill: none; stroke: #334155; stroke-width: 1.6; }
    .txt-title { font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .txt-sub { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
    .txt-dec { font-size: 10px; font-weight: 600; fill: #854d0e; text-anchor: middle; }
    .txt-branch { font-size: 9.5px; font-weight: 600; fill: #475569; }
  </style>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Two-Stage Map-Reduce Literature Review Activity Diagram</text>
  <text x="380" y="42" text-anchor="middle" font-size="11" fill="#64748b">Asynchronous Parallel Map Extraction and Thematic Reduce Synthesis</text>

  <!-- Start Node -->
  <circle cx="380" cy="70" r="10" class="start-node"/>
  <line x1="380" y1="80" x2="380" y2="105" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Step 1: Select Papers -->
  <g transform="translate(245, 105)">
    <rect width="270" height="42" class="act-box"/>
    <text x="135" y="20" class="txt-title">Select Target Papers in Matrix Studio</text>
    <text x="135" y="33" class="txt-sub">User checks M publications across corpus</text>
  </g>
  <line x1="380" y1="147" x2="380" y2="175" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Decision: M >= 2 -->
  <polygon points="380,175 450,205 380,235 310,205" class="dec-node"/>
  <text x="380" y="202" class="txt-dec">Count</text>
  <text x="380" y="214" class="txt-dec">M ≥ 2?</text>

  <!-- Branch: No -->
  <line x1="450" y1="205" x2="550" y2="205" class="flow-line" marker-end="url(#ar3)"/>
  <text x="475" y="198" class="txt-branch">[No]</text>
  <g transform="translate(550, 185)">
    <rect width="160" height="40" class="act-box"/>
    <text x="80" y="19" class="txt-title">Prompt User</text>
    <text x="80" y="31" class="txt-sub">"Select ≥ 2 papers to compare"</text>
  </g>
  <line x1="630" y1="225" x2="630" y2="260" class="flow-line" marker-end="url(#ar3)"/>
  <circle cx="630" cy="275" r="14" class="end-node-outer"/>
  <circle cx="630" cy="275" r="8" class="end-node-inner"/>

  <!-- Branch: Yes -->
  <line x1="380" y1="235" x2="380" y2="270" class="flow-line" marker-end="url(#ar3)"/>
  <text x="390" y="252" class="txt-branch">[Yes]</text>

  <!-- Dispatch asyncio.gather -->
  <g transform="translate(230, 270)">
    <rect width="300" height="42" class="act-box"/>
    <text x="150" y="20" class="txt-title">Dispatch Async Map Coroutines</text>
    <text x="150" y="33" class="txt-sub">asyncio.gather across papers 1 to M</text>
  </g>
  <line x1="380" y1="312" x2="380" y2="345" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Fork Bar: Map Phase -->
  <rect x="140" y="345" width="480" height="6" class="fork-bar"/>
  <line x1="200" y1="351" x2="200" y2="380" class="flow-line" marker-end="url(#ar3)"/>
  <line x1="380" y1="351" x2="380" y2="380" class="flow-line" marker-end="url(#ar3)"/>
  <line x1="560" y1="351" x2="560" y2="380" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Worker 1 -->
  <g transform="translate(120, 380)">
    <rect width="160" height="55" class="act-box"/>
    <text x="80" y="18" class="txt-title">Map Worker 1</text>
    <text x="80" y="32" class="txt-sub">Extract Paper 1:</text>
    <text x="80" y="44" class="txt-sub">Problem, Method, Findings</text>
  </g>

  <!-- Worker 2 -->
  <g transform="translate(300, 380)">
    <rect width="160" height="55" class="act-box"/>
    <text x="80" y="18" class="txt-title">Map Worker 2</text>
    <text x="80" y="32" class="txt-sub">Extract Paper 2:</text>
    <text x="80" y="44" class="txt-sub">Problem, Method, Findings</text>
  </g>

  <!-- Worker M -->
  <g transform="translate(480, 380)">
    <rect width="160" height="55" class="act-box"/>
    <text x="80" y="18" class="txt-title">Map Worker M</text>
    <text x="80" y="32" class="txt-sub">Extract Paper M:</text>
    <text x="80" y="44" class="txt-sub">Problem, Method, Findings</text>
  </g>

  <!-- Join Bar -->
  <line x1="200" y1="435" x2="200" y2="470" class="flow-line"/>
  <line x1="380" y1="435" x2="380" y2="470" class="flow-line"/>
  <line x1="560" y1="435" x2="560" y2="470" class="flow-line"/>
  <rect x="140" y="470" width="480" height="6" class="fork-bar"/>
  <line x1="380" y1="476" x2="380" y2="505" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Step: Stream SSE Progress -->
  <g transform="translate(240, 505)">
    <rect width="280" height="40" class="act-box"/>
    <text x="140" y="19" class="txt-title">Stream Progress Status (SSE)</text>
    <text x="140" y="31" class="txt-sub">Notify UI of completed extractions</text>
  </g>
  <line x1="380" y1="545" x2="380" y2="575" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Reduce Phase: Thematic Synthesis -->
  <g transform="translate(210, 575)">
    <rect width="340" height="45" class="act-box-accent"/>
    <text x="170" y="20" class="txt-title" fill="#7e22ce">Thematic Reduce Synthesis</text>
    <text x="170" y="34" class="txt-sub">Align papers by common methodology &amp; metrics</text>
  </g>
  <line x1="380" y1="620" x2="380" y2="650" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Research Gap Identification -->
  <g transform="translate(210, 650)">
    <rect width="340" height="45" class="act-box-accent"/>
    <text x="170" y="20" class="txt-title" fill="#7e22ce">Research Gap Identification</text>
    <text x="170" y="34" class="txt-sub">Comparative absence analysis across publications</text>
  </g>
  <line x1="380" y1="695" x2="380" y2="725" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Render Matrix in UI -->
  <g transform="translate(230, 725)">
    <rect width="300" height="42" class="act-box"/>
    <text x="150" y="20" class="txt-title">Render Comparative Matrix Grid</text>
    <text x="150" y="33" class="txt-sub">Interactive table in Literature Review Studio</text>
  </g>
  <line x1="380" y1="767" x2="380" y2="795" class="flow-line" marker-end="url(#ar3)"/>

  <!-- Export to Writer / CSV -->
  <g transform="translate(245, 795)">
    <rect width="270" height="40" class="act-box"/>
    <text x="135" y="19" class="txt-title">Export to Document Writer / CSV</text>
    <text x="135" y="31" class="txt-sub">Integrate synthesis into thesis draft</text>
  </g>
  <line x1="380" y1="835" x2="380" y2="865" class="flow-line" marker-end="url(#ar3)"/>

  <!-- End Node -->
  <circle cx="380" cy="875" r="14" class="end-node-outer"/>
  <circle cx="380" cy="875" r="8" class="end-node-inner"/>
</svg>