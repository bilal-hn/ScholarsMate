<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 730" width="940" height="730" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .table-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    .header-users { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; }
    .header-sessions { fill: #ffedd5; stroke: #f97316; stroke-width: 1.5; }
    .header-messages { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; }
    .header-docs { fill: #ccfbf1; stroke: #14b8a6; stroke-width: 1.5; }
    .header-drafts { fill: #f3e8ff; stroke: #a855f7; stroke-width: 1.5; }
    .header-brain { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.5; }
    .th { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10px; font-weight: 500; fill: #475569; }
    .attr { font-size: 11.5px; fill: #1e293b; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .type { font-size: 10.5px; fill: #64748b; }
    .pk { font-size: 10px; font-weight: 700; fill: #b45309; background: #fef3c7; }
    .fk { font-size: 10px; font-weight: 700; fill: #15803d; }
    .rel-line { fill: none; stroke: #475569; stroke-width: 1.8; }
    .rel-text { font-size: 11px; font-weight: 600; fill: #334155; }
  </style>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <!-- Crow's foot one to many marker -->
    <marker id="crow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 M 1 6 L 11 6" fill="none" stroke="#475569" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="470" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ScholarsMate Relational Entity-Relationship Model</text>
  <text x="470" y="42" text-anchor="middle" font-size="11.5" fill="#64748b">Decoupled Relational Persistence (SQLAlchemy 2.0 Async / SQLite) with HNSW Vector Store</text>

  <!-- ==================== RELATIONSHIP LINES ==================== -->
  <!-- 1. USERS -> USER_DOCUMENTS (Horizontal: x=400, y=140 to x=540, y=140) -->
  <path d="M 410 140 L 530 140" class="rel-line" marker-end="url(#crow)"/>
  <rect x="445" y="125" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="139" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- 2. USERS -> CHAT_SESSIONS (Vertical: x=220, y=240 to x=220, y=275) -->
  <path d="M 220 240 L 220 275" class="rel-line" marker-end="url(#crow)"/>
  <rect x="230" y="246" width="46" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="253" y="259" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- 3. CHAT_SESSIONS -> WORKSPACE_DRAFTS (Horizontal: x=410, y=365 to x=530, y=365) -->
  <path d="M 410 365 L 530 365" class="rel-line" marker-end="url(#arrow)"/>
  <rect x="445" y="352" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="470" y="366" text-anchor="middle" class="rel-text">1 : 1</text>

  <!-- 4. CHAT_SESSIONS -> CHAT_MESSAGES (Vertical: x=220, y=475 to x=220, y=510) -->
  <path d="M 220 475 L 220 510" class="rel-line" marker-end="url(#crow)"/>
  <rect x="230" y="482" width="46" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="253" y="495" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- 5. CHAT_SESSIONS -> BRAIN_MEMORIES (Diagonal / Elbow) -->
  <path d="M 410 420 L 470 420 L 470 575 L 530 575" class="rel-line" marker-end="url(#crow)"/>
  <rect x="448" y="490" width="46" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="471" y="503" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- ==================== ENTITY 1: USERS (Top Left) ==================== -->
  <g transform="translate(30, 60)">
    <rect width="380" height="180" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-users" rx="8"/>
    <text x="14" y="22" class="th">USERS</text>
    <text x="366" y="22" text-anchor="end" class="sub">User Identity &amp; Auth</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="20" class="attr"><tspan fill="#3b82f6" font-weight="bold">UK </tspan>email</text><text x="210" y="20" class="type">VARCHAR (Indexed)</text>
      <text y="40" class="attr"><tspan fill="#3b82f6" font-weight="bold">UK </tspan>google_id</text><text x="210" y="40" class="type">VARCHAR (OAuth ID)</text>
      <text y="60" class="attr">   name</text><text x="210" y="60" class="type">VARCHAR</text>
      <text y="80" class="attr">   avatar_url</text><text x="210" y="80" class="type">VARCHAR</text>
      <text y="100" class="attr">   is_guest</text><text x="210" y="100" class="type">BOOLEAN (Default: False)</text>
      <text y="120" class="attr">   created_at</text><text x="210" y="120" class="type">DATETIME (UTC)</text>
    </g>
  </g>

  <!-- ==================== ENTITY 2: USER_DOCUMENTS (Top Right) ==================== -->
  <g transform="translate(530, 60)">
    <rect width="380" height="180" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-docs" rx="8"/>
    <text x="14" y="22" class="th">USER_DOCUMENTS</text>
    <text x="366" y="22" text-anchor="end" class="sub">Ingested Academic Papers</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#14b8a6" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="20" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>user_id</text><text x="210" y="20" class="type">VARCHAR → users.id</text>
      <text y="40" class="attr">   doc_name</text><text x="210" y="40" class="type">VARCHAR (Filename)</text>
      <text y="60" class="attr">   file_hash</text><text x="210" y="60" class="type">VARCHAR (SHA-256 Digest)</text>
      <text y="80" class="attr">   summary_cache</text><text x="210" y="80" class="type">TEXT (FR-11 Pre-computed)</text>
      <text y="100" class="attr">   summary_gen_at</text><text x="210" y="100" class="type">DATETIME</text>
      <text y="120" class="attr">   created_at</text><text x="210" y="120" class="type">DATETIME (UTC)</text>
    </g>
  </g>

  <!-- ==================== ENTITY 3: CHAT_SESSIONS (Middle Left) ==================== -->
  <g transform="translate(30, 275)">
    <rect width="380" height="200" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-sessions" rx="8"/>
    <text x="14" y="22" class="th">CHAT_SESSIONS</text>
    <text x="366" y="22" text-anchor="end" class="sub">Research Workspaces</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#f97316" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="22" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>user_id</text><text x="210" y="22" class="type">VARCHAR → users.id</text>
      <text y="44" class="attr">   title</text><text x="210" y="44" class="type">VARCHAR</text>
      <text y="66" class="attr">   doc_names</text><text x="210" y="66" class="type">JSON (Active Papers List)</text>
      <text y="88" class="attr">   active_mode</text><text x="210" y="88" class="type">VARCHAR (research, etc.)</text>
      <text y="110" class="attr">   created_at</text><text x="210" y="110" class="type">DATETIME (UTC)</text>
      <text y="132" class="attr">   updated_at</text><text x="210" y="132" class="type">DATETIME (UTC)</text>
    </g>
  </g>

  <!-- ==================== ENTITY 4: WORKSPACE_DRAFTS (Middle Right) ==================== -->
  <g transform="translate(530, 275)">
    <rect width="380" height="180" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-drafts" rx="8"/>
    <text x="14" y="22" class="th">WORKSPACE_DRAFTS</text>
    <text x="366" y="22" text-anchor="end" class="sub">Document Writer Studio</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#a855f7" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="24" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>session_id</text><text x="210" y="24" class="type">VARCHAR (1:1 chat_sessions.id)</text>
      <text y="48" class="attr">   title</text><text x="210" y="48" class="type">VARCHAR</text>
      <text y="72" class="attr">   content_html</text><text x="210" y="72" class="type">TEXT (Rich-Text DOM)</text>
      <text y="96" class="attr">   content_markdown</text><text x="210" y="96" class="type">TEXT (Plaintext / Export)</text>
    </g>
  </g>

  <!-- ==================== ENTITY 5: CHAT_MESSAGES (Bottom Left) ==================== -->
  <g transform="translate(30, 510)">
    <rect width="380" height="200" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-messages" rx="8"/>
    <text x="14" y="22" class="th">CHAT_MESSAGES</text>
    <text x="366" y="22" text-anchor="end" class="sub">Turn Dialogue &amp; Citations</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="18" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>session_id</text><text x="210" y="18" class="type">VARCHAR → chat_sessions.id</text>
      <text y="36" class="attr">   sender</text><text x="210" y="36" class="type">VARCHAR ('user' | 'bot')</text>
      <text y="54" class="attr">   text</text><text x="210" y="54" class="type">TEXT (Message Payload)</text>
      <text y="72" class="attr">   thinking_process</text><text x="210" y="72" class="type">TEXT (Reasoning Trace)</text>
      <text y="90" class="attr">   sources_used</text><text x="210" y="90" class="type">JSON (Chunks &amp; Page IDs)</text>
      <text y="108" class="attr">   model_name</text><text x="210" y="108" class="type">VARCHAR (LLM Selected)</text>
      <text y="126" class="attr">   timestamp</text><text x="210" y="126" class="type">DATETIME (UTC)</text>
    </g>
  </g>

  <!-- ==================== ENTITY 6: BRAIN_MEMORIES (Bottom Right) ==================== -->
  <g transform="translate(530, 490)">
    <rect width="380" height="220" class="table-card"/>
    <path d="M 0 0 h 380 v 34 h -380 z" class="header-brain" rx="8"/>
    <text x="14" y="22" class="th">BRAIN_MEMORIES</text>
    <text x="366" y="22" text-anchor="end" class="sub">Autonomous Long-Term Recall</text>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#6366f1" stroke-width="1.5"/>

    <!-- Rows -->
    <g transform="translate(14, 52)">
      <text y="0" class="attr"><tspan class="pk" font-weight="bold">PK </tspan>id</text><text x="210" y="0" class="type">VARCHAR [UUID]</text>
      <text y="19" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>user_id</text><text x="210" y="19" class="type">VARCHAR → users.id</text>
      <text y="38" class="attr"><tspan class="fk" font-weight="bold">FK </tspan>workspace_id</text><text x="210" y="38" class="type">VARCHAR (Nullable)</text>
      <text y="57" class="attr">   scope</text><text x="210" y="57" class="type">VARCHAR ('global' | 'workspace')</text>
      <text y="76" class="attr">   category</text><text x="210" y="76" class="type">VARCHAR (profile, pref, etc.)</text>
      <text y="95" class="attr">   thought</text><text x="210" y="95" class="type">TEXT (Extracted Fact)</text>
      <text y="114" class="attr">   is_active</text><text x="210" y="114" class="type">BOOLEAN (Default: True)</text>
      <text y="133" class="attr">   created_at</text><text x="210" y="133" class="type">DATETIME (UTC)</text>
    </g>
  </g>

</svg>