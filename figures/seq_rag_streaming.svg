<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .actor-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; }
    .actor-title { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .act-box { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; rx: 2; }
    .msg-line { stroke: #334155; stroke-width: 1.5; fill: none; }
    .ret-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
    .msg-text { font-size: 11px; fill: #1e293b; font-weight: 500; }
    .note-box { fill: #fef9c3; stroke: #eab308; stroke-width: 1; rx: 4; }
    .note-text { font-size: 10px; fill: #713f12; }
    .group-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5,3; rx: 6; }
    .group-label { font-size: 10px; font-weight: 700; fill: #475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Conversational RAG Streaming &amp; Citation Verification Sequence</text>
  <text x="440" y="42" text-anchor="middle" font-size="11" fill="#64748b">Event-Driven Asynchronous Pipeline (SSE Token Streaming &amp; Dual-Tier Storage)</text>

  <!-- Actors Header (x positions: User=60, UI=200, API=350, Router=500, Chroma=640, LLM=770) -->
  <!-- Lifelines -->
  <line x1="60" y1="85" x2="60" y2="690" class="lifeline"/>
  <line x1="200" y1="85" x2="200" y2="690" class="lifeline"/>
  <line x1="350" y1="85" x2="350" y2="690" class="lifeline"/>
  <line x1="500" y1="85" x2="500" y2="690" class="lifeline"/>
  <line x1="640" y1="85" x2="640" y2="690" class="lifeline"/>
  <line x1="770" y1="85" x2="770" y2="690" class="lifeline"/>

  <!-- Actor Boxes Top -->
  <g transform="translate(10, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">Researcher</text><text x="50" y="28" class="actor-sub">User Actor</text></g>
  <g transform="translate(150, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">React 19 SPA</text><text x="50" y="28" class="actor-sub">Chat Studio</text></g>
  <g transform="translate(300, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">FastAPI Gateway</text><text x="50" y="28" class="actor-sub">Uvicorn ASGI</text></g>
  <g transform="translate(450, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">3-Gate Router</text><text x="50" y="28" class="actor-sub">Intent &amp; Filter</text></g>
  <g transform="translate(590, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">ChromaDB</text><text x="50" y="28" class="actor-sub">HNSW Index</text></g>
  <g transform="translate(720, 50)"><rect width="100" height="35" class="actor-box"/><text x="50" y="16" class="actor-title">LiteLLM Engine</text><text x="50" y="28" class="actor-sub">Model Orchestrator</text></g>

  <!-- Step 1: User submits query -->
  <line x1="60" y1="110" x2="192" y2="110" class="msg-line" marker-end="url(#arr)"/>
  <text x="68" y="104" class="msg-text">1: Submit research query</text>
  <rect x="195" y="110" width="10" height="540" class="act-box"/>

  <!-- Step 2: UI dispatches POST stream -->
  <line x1="205" y1="135" x2="342" y2="135" class="msg-line" marker-end="url(#arr)"/>
  <text x="212" y="129" class="msg-text">2: POST /api/chat/stream {query, session, model}</text>
  <rect x="345" y="135" width="10" height="500" class="act-box"/>

  <!-- Step 3: API to Router -->
  <line x1="355" y1="165" x2="492" y2="165" class="msg-line" marker-end="url(#arr)"/>
  <text x="362" y="159" class="msg-text">3: classify_query_intent()</text>
  <rect x="495" y="165" width="10" height="155" class="act-box"/>

  <!-- Step 4: Router to ChromaDB -->
  <line x1="505" y1="195" x2="632" y2="195" class="msg-line" marker-end="url(#arr)"/>
  <text x="512" y="189" class="msg-text">4: search_similar_chunks(q, top_k=10)</text>
  <rect x="635" y="195" width="10" height="40" class="act-box"/>

  <!-- Step 5: Chroma returns chunks -->
  <line x1="635" y1="235" x2="505" y2="235" class="ret-line" marker-end="url(#arr-gray)"/>
  <text x="518" y="229" class="msg-text">5: Candidate chunks &amp; cosine distance d</text>

  <!-- Note: Quality Gate 2 & 3 -->
  <g transform="translate(420, 250)">
    <rect width="210" height="40" class="note-box"/>
    <text x="8" y="16" class="note-text" font-weight="bold">Gate 2: Distance filter (d ≤ 0.75)</text>
    <text x="8" y="30" class="note-text">Gate 3: Context pack (≤ 4200 tokens)</text>
  </g>

  <!-- Step 6: Return packed prompt to API -->
  <line x1="495" y1="315" x2="355" y2="315" class="ret-line" marker-end="url(#arr-gray)"/>
  <text x="368" y="309" class="msg-text">6: Prompt buffer + page anchors</text>

  <!-- Step 7: Call LiteLLM stream -->
  <line x1="355" y1="345" x2="762" y2="345" class="msg-line" marker-end="url(#arr)"/>
  <text x="362" y="339" class="msg-text">7: stream_completion(prompt, model, BYOK)</text>
  <rect x="765" y="345" width="10" height="160" class="act-box"/>

  <!-- Loop: SSE Token Streaming -->
  <rect x="180" y="375" width="610" height="115" class="group-box"/>
  <text x="190" y="390" class="group-label">LOOP [Server-Sent Events (SSE) Streaming]</text>

  <line x1="765" y1="410" x2="355" y2="410" class="ret-line" marker-end="url(#arr-gray)"/>
  <text x="500" y="404" class="msg-text">8a: Yield token delta &amp; reasoning</text>

  <line x1="345" y1="435" x2="205" y2="435" class="msg-line" marker-end="url(#arr)"/>
  <text x="218" y="429" class="msg-text">8b: SSE Event {chunk, thinking_trace, citations}</text>

  <line x1="195" y1="465" x2="60" y2="465" class="msg-line" marker-end="url(#arr)"/>
  <text x="68" y="459" class="msg-text">8c: Live render markdown + citation pills</text>

  <!-- Par: Dual background persistence -->
  <rect x="330" y="525" width="460" height="90" class="group-box"/>
  <text x="340" y="540" class="group-label">PAR [Non-Blocking Background Tasks]</text>
  <text x="350" y="565" class="msg-text">9a: INSERT INTO chat_messages (text, sources, latency)</text>
  <text x="350" y="595" class="msg-text">9b: extract_brain_memories() → INSERT INTO brain_memories</text>

  <!-- Completion ACK -->
  <line x1="345" y1="640" x2="205" y2="640" class="ret-line" marker-end="url(#arr-gray)"/>
  <text x="220" y="634" class="msg-text">10: Stream closed [DONE]</text>
</svg>